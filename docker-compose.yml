name: gr001-marathon-diary

services:
  postgres:
    image: postgres:18.6
    container_name: gr001-marathon-diary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marathondiary}
      POSTGRES_USER: ${POSTGRES_USER:-marathondiary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marathondiary}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Tokyo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 以降はデータディレクトリの親（/var/lib/postgresql）をマウントする
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
